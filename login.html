<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logg inn – Vaktrapport</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-overlay: rgba(0, 0, 0, 0.55);
            --card-bg: rgba(15, 23, 42, 0.92);
            --card-border: rgba(148, 163, 184, 0.4);
            --accent: #1E88E5;
            --accent-dark: #1565C0;
            --text-main: #E5E7EB;
            --text-muted: #9CA3AF;
            --error: #EF4444;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            background: #020617;
        }
        .landing {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }
        .landing::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url('assets/landing-bg.webp');
            background-size: cover;
            background-position: center;
            filter: brightness(0.7);
            z-index: -2;
        }
        .landing::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top, rgba(15, 23, 42, 0.6), rgba(15, 23, 42, 0.9));
            z-index: -1;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 32px 28px 28px;
            border-radius: 16px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow:
                0 20px 45px rgba(0,0,0,0.6),
                0 0 0 1px rgba(15,23,42,0.9);
            backdrop-filter: blur(18px);
        }
        .logo-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }
        .logo-row img {
            height: 40px;
            width: auto;
        }
        .logo-row span {
            font-size: 0.9rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 6px;
        }
        p.subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 6px;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.7);
            background: rgba(15, 23, 42, 0.95);
            color: var(--text-main);
            font-size: 0.95rem;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.5);
        }
        button {
            width: 100%;
            margin-top: 16px;
            padding: 11px 14px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: #F9FAFB;
            font-weight: 600;
            font-size: 0.98rem;
            cursor: pointer;
            transition: transform 120ms ease, box-shadow 120ms ease, background 150ms ease;
            box-shadow: 0 12px 25px rgba(37, 99, 235, 0.45);
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 32px rgba(37, 99, 235, 0.55);
        }
        button:active {
            transform: translateY(0);
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.9);
        }
        .login-error {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--error);
            display: none;
        }
        .login-error.visible {
            display: block;
        }
        .meta {
            margin-top: 14px;
            font-size: 0.78rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="landing">
        <div class="login-card">
            <div class="logo-row">
                <img src="assets/airliftlogo.webp" alt="Airlift logo">
                <span>vaktrapport</span>
            </div>
            <h1>Vaktrapport-generator</h1>
            <p class="subtitle">Logg inn med passord for å åpne skifterapport-verktøyet.</p>
            <form id="loginForm" autocomplete="off">
                <label for="password">Passord</label>
                <input type="password" id="password" name="password" placeholder="Skriv inn passordet" required autocomplete="off">
                <p class="login-error" id="loginError">Feil passord. Prøv igjen.</p>
                <button type="submit">Logg inn</button>
                <p class="meta">Tilgang er begrenset til interne brukere. Del ikke passordet videre.</p>
            </form>
        </div>
    </div>
    <script>
        (function () {
            var PASSWORD = '169169';
            var form = document.getElementById('loginForm');
            var input = document.getElementById('password');
            var errorEl = document.getElementById('loginError');

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                errorEl.classList.remove('visible');
                if (input.value === PASSWORD) {
                    sessionStorage.setItem('vaktrapport_auth', '1');
                    window.location.href = 'index.html';
                } else {
                    errorEl.classList.add('visible');
                    input.value = '';
                    input.focus();
                }
            });
        })();
    </script>
</body>
</html>
